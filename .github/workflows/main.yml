name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save three@0.160.1 vazirmatn @fontsource-variable/space-grotesk

      - name: Copy three.js and fonts into the game
        run: |
          mkdir -p www/fonts
          cp node_modules/three/build/three.min.js www/three.min.js
          cp "$(find node_modules/vazirmatn -name 'Vazirmatn*wght*.woff2' | head -n 1)" www/fonts/Vazirmatn.woff2 || true
          cp "$(find node_modules/@fontsource-variable/space-grotesk/files -name '*latin-wght-normal.woff2' | head -n 1)" www/fonts/SpaceGrotesk.woff2 || true

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          OUT=android/app/build/outputs/apk/release
          keytool -genkeypair -keystore release.jks -alias mialand -keyalg RSA -keysize 2048 -validity 10000 -storepass mialand123 -keypass mialand123 -dname "CN=Mialand, O=Mialand, C=IR"
          $BT/zipalign -p -f 4 $OUT/app-release-unsigned.apk $OUT/aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass pass:mialand123 --key-pass pass:mialand123 --out $OUT/mialand-arena.apk $OUT/aligned.apk
          $BT/apksigner verify $OUT/mialand-arena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mialand-arena-release
          path: android/app/build/outputs/apk/release/mialand-arena.apk
