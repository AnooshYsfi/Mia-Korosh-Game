name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save three@0.160.1 vazirmatn @fontsource-variable/space-grotesk

      - name: Copy three.js and fonts into the game
        run: |
          mkdir -p www/fonts
          cp node_modules/three/build/three.min.js www/three.min.js
          cp "$(find node_modules/vazirmatn -name 'Vazirmatn*wght*.woff2' | head -n 1)" www/fonts/Vazirmatn.woff2 || true
          cp "$(find node_modules/@fontsource-variable/space-grotesk/files -name '*latin-wght-normal.woff2' | head -n 1)" www/fonts/SpaceGrotesk.woff2 || true

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mialand-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
